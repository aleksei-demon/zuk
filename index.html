<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жуки</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #234;
            color: #fff;
            overflow: hidden;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: min(900px, 100%);
            height: min(700px, 100%);
            background: #ffffff;
            color: #222;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: #f3f3f3;
        }

        .nameBox {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(24px, 4vw, 42px);
            font-weight: bold;
            text-align: center;
            border-radius: 15px;
            background: white;
            border: 3px solid #ddd;
            padding: 10px;
        }

        .photo {
            width: 320px;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #ddd;
            background: #eee;
        }

        .desc {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: clamp(18px, 2vw, 24px);
            line-height: 1.6;
        }

        .bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f3f3f3;
        }

        .btn {
            border: none;
            cursor: pointer;
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 20px;
        }

        .speakBtn {
            font-size: 32px;
        }

        .nav {
            position: fixed;
            top: 80%;
            transform: translateY(-50%);
            width: 90px;
            height: 160px;
            border: none;
            font-size: 60px;
            color: white;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(3px);
            cursor: pointer;
            user-select: none;
        }

        .nav:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        #prev {
            left: 0;
            border-radius: 0 25px 25px 0;
        }

        #next {
            right: 0;
            border-radius: 25px 0 0 25px;
        }

        .counter {
            font-size: 18px;
            color: #666;
        }

        @media(max-width:700px) {

            .top {
                flex-direction: column;
            }

            .photo {
                width: 100%;
                height: 250px;
            }

            .nav {
                width: 70px;
                height: 120px;
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <button id="prev" class="nav">◀</button>

        const counterEl = document.getElementById("counter");

        function showBug() {

            const bug = bugs[index];

            nameEl.textContent = bug.name;
            photoEl.src = bug.img;
            descEl.textContent = bug.desc.trim();

            counterEl.textContent =
                (index + 1) + " / " + bugs.length;
        }

        function nextBug() {
            index++;
            if (index >= bugs.length) index = 0;
            showBug();
        }

        function prevBug() {
            index--;
            if (index < 0) index = bugs.length - 1;
            showBug();
        }

        function speakCurrent() {

            speechSynthesis.cancel();

            const bug = bugs[index];

            const utter = new SpeechSynthesisUtterance(
                bug.name + ". " + bug.desc
            );

            utter.lang = "ru-RU";
            utter.rate = 0.95;

            speechSynthesis.speak(utter);
        }

        document.getElementById("next").onclick = nextBug;
        document.getElementById("prev").onclick = prevBug;

        document.addEventListener("keydown", (e) => {

            if (e.key === "ArrowRight") nextBug();

            if (e.key === "ArrowLeft") prevBug();

            if (e.key === " ") {
                e.preventDefault();
                speakCurrent();
            }
        });

        showBug();

    </script>

</body>

</html>
