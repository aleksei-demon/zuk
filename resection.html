<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resection — ревизия каталога</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1018'/%3E%3Ctext x='50%25' y='52%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial,sans-serif' font-size='52' font-weight='900' fill='%23ff202e'%3ER%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#080c12;--panel:#101722;--line:#263246;--muted:#91a0b9;--text:#f1f5fb;--red:#f32638;--green:#08a84f;--field:#0c121b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{display:flex;flex-direction:column;overflow:hidden}button,input,textarea{font:inherit}button{border:1px solid #34425a;background:#202b3d;color:white;border-radius:1.1vh;cursor:pointer;font-weight:650;transition:filter .12s,background .12s}button:hover{filter:brightness(1.16)}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #f64a57;outline-offset:2px}
header{height:8%;min-height:48px;max-height:80px;display:flex;align-items:center;gap:1.3%;padding:0 2.2%;border-bottom:1px solid var(--line);flex-shrink:0}.logo{font-size:clamp(28px,3vw,48px);font-weight:1000;color:#ff2637;line-height:1;text-shadow:0 0 18px #f3263830}.brand{font-size:clamp(18px,1.8vw,30px);font-weight:800}.tagline{padding-left:1.8%;margin-left:1%;border-left:1px solid #344056;color:var(--muted);font-size:clamp(11px,1.1vw,17px)}.motto{margin-left:auto;color:var(--muted);font-size:clamp(10px,1vw,15px);font-style:italic;text-align:right}
main{height:84%;padding:1.6% 2.1% 0;display:flex;flex-direction:column;min-height:0}.paste-panel{display:flex;align-items:center;gap:1%;padding:0 0 1%;flex-shrink:0}.paste-panel label{color:var(--muted);font-size:clamp(11px,1vw,15px);white-space:nowrap}.paste-panel textarea{height:5.5vh;min-height:38px;max-height:70px;resize:vertical;flex:1;background:var(--field);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:.5% .8%;font:clamp(10px,.85vw,13px)/1.3 ui-monospace,SFMono-Regular,Consolas,monospace}.primary-small{padding:.7% 1.5%;white-space:nowrap;font-size:clamp(11px,1vw,15px)}
.workspace{flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;background:linear-gradient(140deg,#0e141e,#090e15);display:flex;flex-direction:column;overflow:hidden}.preview{height:62%;min-height:0;display:grid;grid-template-columns:1fr 1.04fr;position:relative;border-bottom:1px solid var(--line)}.copy{padding:3.5% 5.2%;overflow:auto;min-width:0}.object-title{font-size:clamp(18px,2.5vw,38px);line-height:1.18;font-weight:800;margin:0 0 2.2%;overflow-wrap:anywhere}.object-desc{font-size:clamp(12px,1.55vw,23px);line-height:1.55;color:#c2ccdd;white-space:pre-wrap;overflow-wrap:anywhere}.image-wrap{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:#070b11;overflow:hidden}.image-wrap img{display:none;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}.image-wrap img.visible{display:block}.no-image{display:none;color:#64738c;font-size:clamp(12px,1.2vw,18px);text-align:center;padding:4%}.no-image.visible{display:block}.counter{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);display:flex;align-items:center;gap:.6vw;background:#0b111bdc;border:1px solid #29364a;border-radius:10px;padding:.45% .8%;backdrop-filter:blur(8px);font-variant-numeric:tabular-nums}.counter button{border:0;background:transparent;font-size:clamp(20px,2.2vw,34px);line-height:1;padding:.1em .35em}.count-label{font-size:clamp(12px,1.25vw,19px);min-width:4.5em;text-align:center;font-weight:700}
.editor{height:38%;min-height:0;padding:1.5% 2.6% 1.7%;display:flex;flex-direction:column;gap:1.5%}.fields{display:grid;grid-template-columns:1fr 1fr;gap:1.7%;flex:1;min-height:0}.field{display:flex;flex-direction:column;gap:.5%;min-height:0}.field label{font-size:clamp(11px,1.1vw,16px);color:var(--muted)}.field input,.field textarea{width:100%;min-height:0;flex:1;background:var(--field);border:1px solid #34435b;border-radius:9px;color:var(--text);padding:1.1% 2.5%;font-size:clamp(12px,1.35vw,20px)}.field textarea{resize:vertical;line-height:1.4}.actions{display:grid;grid-template-columns:.7fr .95fr 1.05fr .7fr 1.35fr;gap:1.2%;height:22%;min-height:34px}.actions button{font-size:clamp(11px,1.15vw,17px);padding:0 1%;display:flex;align-items:center;justify-content:center;gap:.55em}.actions .delete{background:#e92135;border-color:#f43b4c}.actions .copy-result{background:var(--green);border-color:#13b75b}.actions .editing{background:#465b7c;border-color:#7187aa}
footer{height:8%;min-height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 2.4%;color:var(--muted);font-size:clamp(10px,1.1vw,16px);gap:2%}.status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.help{text-align:right;white-space:nowrap}.toast{position:fixed;left:50%;bottom:3%;transform:translate(-50%,120%);opacity:0;transition:all .2s;background:#172538;border:1px solid #42536c;padding:10px 18px;border-radius:9px;z-index:5;pointer-events:none;font-size:14px}.toast.show{transform:translate(-50%,0);opacity:1}.hidden{display:none!important}
@media(max-aspect-ratio:1/1){header{height:7%}.tagline,.motto{display:none}main{height:86%;padding:2%}.paste-panel{flex-wrap:wrap}.paste-panel label{width:100%}.paste-panel textarea{flex-basis:70%}.preview{height:55%;grid-template-columns:1fr}.copy{padding:3% 4%;max-height:48%}.object-title{font-size:clamp(16px,3vw,26px)}.object-desc{font-size:clamp(11px,2vw,17px)}.image-wrap{position:absolute;inset:48% 0 0}.counter{bottom:2%}.editor{height:45%;padding:2%;gap:2%}.fields{grid-template-columns:1fr 1fr}.actions{grid-template-columns:.5fr .8fr .8fr .5fr 1fr;height:24%}.actions button{font-size:clamp(10px,1.8vw,14px)}footer{height:7%;padding:0 2%}.help{display:none}}
</style>
</head>
<body>

<main>
<section class="paste-panel" aria-label="Исходный код"><label for="source">Вставь сюда весь файл из VS Code:</label><textarea id="source" spellcheck="false" placeholder="Вставь содержимое .js-файла целиком…"></textarea><button id="load" class="primary-small">Загрузить массив</button></section>
<section class="workspace" aria-label="Редактор объектов">
<div class="preview"><div class="copy"><h1 id="previewName" class="object-title">Вставь код и нажми «Загрузить массив»</h1><div id="previewDesc" class="object-desc"></div></div><div class="image-wrap"><img id="previewImg" alt=""><div id="noImage" class="no-image">Нет изображения<br><small>или файл не найден</small></div></div><div class="counter"><button id="prev" title="Предыдущий объект (←)" aria-label="Предыдущий">‹</button><div id="counterText" class="count-label">0 / 0</div><button id="next" title="Следующий объект (→)" aria-label="Следующий">›</button></div></div>
<div class="editor"><div class="fields"><div class="field"><label for="nameField">name</label><input id="nameField" autocomplete="off" placeholder="Название объекта"></div><div class="field"><label for="descField">desc</label><textarea id="descField" placeholder="Описание объекта"></textarea></div></div><div class="actions"><button id="prevBottom" title="Стрелка влево">← Назад</button><button id="delete" class="delete" title="Удалить текущий объект (Delete)">⌫ Удалить</button><button id="edit" class="editing" title="Применить изменения к текущему объекту">✎ Редактировать</button><button id="nextBottom" title="Стрелка вправо">Вперёд →</button><button id="copyResult" class="copy-result">▣ Скопировать результат</button></div></div>
</section>
</main>
<footer><div id="status" class="status">Объектов: 0　|　Текущий: —</div><div class="help">← / → — листать　 |　 Delete — удалить</div></footer><div id="toast" class="toast" role="status"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const state={source:'',prefix:'',suffix:'',items:[],index:0,loaded:false,dirty:false};
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2100)}
function scanBalanced(text,start,open,close){let depth=0,quote='',escape=false,lineComment=false,blockComment=false;for(let i=start;i<text.length;i++){const c=text[i],n=text[i+1];if(lineComment){if(c==='\n')lineComment=false;continue}if(blockComment){if(c==='*'&&n==='/'){blockComment=false;i++}continue}if(quote){if(escape){escape=false;continue}if(c==='\\'){escape=true;continue}if(c===quote)quote='';continue}if(c==='/'&&n==='/'){lineComment=true;i++;continue}if(c==='/'&&n==='*'){blockComment=true;i++;continue}if(c==='"'||c==="'"||c==='`'){quote=c;continue}if(c===open)depth++;else if(c===close&&--depth===0)return i}return -1}
function findItemsArray(src){let quote='',esc=false,line=false,block=false;for(let i=0;i<src.length;i++){const c=src[i],n=src[i+1];if(line){if(c==='\n')line=false;continue}if(block){if(c==='*'&&n==='/'){block=false;i++}continue}if(quote){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if(c===quote)quote='';continue}if(c==='/'&&n==='/'){line=true;i++;continue}if(c==='/'&&n==='*'){block=true;i++;continue}if(c==='"'||c==="'"||c==='`'){quote=c;continue}const m=/\bitems\s*:\s*\[/.exec(src.slice(i));if(m&&m.index===0){const open=i+m[0].lastIndexOf('['),end=scanBalanced(src,open,'[',']');if(end<0)throw Error('Не удалось найти закрывающую скобку массива items.');return {start:open,end};}}throw Error('Не найден массив items: [...]. Проверь, что вставлен весь файл каталога.')}
function topLevelObjects(src,open,end){const out=[];let i=open+1;while(i<end){while(i<end&&(/[\s,]/.test(src[i])))i++;if(i>=end)break;if(src[i]==='{'){const e=scanBalanced(src,i,'{','}');if(e<0||e>end)throw Error('Не удалось разобрать один из объектов массива.');out.push({start:i,end:e+1,raw:src.slice(i,e+1)});i=e+1;continue}let q='',esc=false,depth=0;for(;i<end;i++){const c=src[i];if(q){if(esc)esc=false;else if(c==='\\')esc=true;else if(c===q)q='';continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='{'||c==='['||c==='(')depth++;else if(c==='}'||c===']'||c===')')depth--;else if(c===','&&depth===0){i++;break}}}return out}
function parseObject(raw){try{return Function('"use strict"; return ('+raw+');')()}catch(e){return {__parseError:true}}}
function propValue(raw,key){const obj=parseObject(raw);if(obj&& !obj.__parseError && obj[key]!==undefined)return obj[key];const re=new RegExp('(?:^|[,\\s{])'+key+'\\s*:\\s*("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\')');const m=re.exec(raw);if(m){try{return Function('return ('+m[1]+')')()}catch(e){return m[1].slice(1,-1)}}return ''}
function escapeReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function quoteJS(s,quote){if(quote==='\'')return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n')+"'";return '"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r/g,'\\r').replace(/\n/g,'\\n').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')+'"'}
function replaceProperty(raw,key,value){const re=new RegExp('(^|[,{\\s])('+escapeReg(key)+'\\s*:\\s*)("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\')','m');const m=re.exec(raw);if(m){const q=m[3][0];return raw.slice(0,m.index)+m[1]+m[2]+quoteJS(value,q)+raw.slice(m.index+m[0].length)}const close=raw.lastIndexOf('}');if(close<0)return raw;const before=raw.slice(0,close);const comma=/,\s*$/.test(before)?'':',';return before+comma+'\n        '+key+': '+quoteJS(value,'"')+',\n    '+raw.slice(close)}
function current(){return state.items[state.index]}
function getItemVal(item,key){return item[key]===undefined||item[key]===null?'':String(item[key])}
function updateStatus(){const n=state.items.length;$('counterText').textContent=n?(state.index+1)+' / '+n:'0 / 0';$('status').textContent='Объектов: '+n+'　|　Текущий: '+(n?state.index+1:'—')+(state.dirty?'　|　Есть несохранённые правки':'');const disabled=!n;['prev','next','prevBottom','nextBottom','delete','edit','copyResult'].forEach(id=>$(id).disabled=disabled)}
function render(){const item=current();if(!item){$('previewName').textContent='Массив пуст';$('previewDesc').textContent='Все объекты удалены. Можно скопировать итоговый файл.';$('nameField').value='';$('descField').value='';$('previewImg').classList.remove('visible');$('noImage').classList.add('visible');updateStatus();return}const name=getItemVal(item.parsed,'name');const desc=getItemVal(item.parsed,'desc');$('previewName').textContent=name;$('previewDesc').textContent=desc;$('nameField').value=name;$('descField').value=desc;const img=getItemVal(item.parsed,'img');const image=$('previewImg');image.classList.remove('visible');$('noImage').classList.add('visible');$('noImage').innerHTML=img?'Загрузка изображения…<br><small>'+escapeHtml(img)+'</small>':'У объекта нет поля img';if(img){image.onload=()=>{image.classList.add('visible');$('noImage').classList.remove('visible')};image.onerror=()=>{image.classList.remove('visible');$('noImage').classList.add('visible');$('noImage').innerHTML='Изображение не найдено<br><small>'+escapeHtml(img)+'</small>'};image.src=img;if(image.complete&&image.naturalWidth){image.classList.add('visible');$('noImage').classList.remove('visible')}}updateStatus()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadSource(){const src=$('source').value;if(!src.trim()){toast('Сначала вставь исходный JavaScript-файл.');return}try{const arr=findItemsArray(src);const objects=topLevelObjects(src,arr.start,arr.end);if(!objects.length)throw Error('Массив items найден, но в нём не обнаружено объектов.');state.source=src;state.prefix=src.slice(0,arr.start+1);state.suffix=src.slice(arr.end);state.items=objects.map(o=>({raw:o.raw,parsed:parseObject(o.raw)}));state.index=0;state.loaded=true;state.dirty=false;render();toast('Загружено объектов: '+state.items.length)}catch(e){toast(e.message||'Не удалось загрузить файл.')}}
function move(delta){if(!state.loaded||!state.items.length)return;saveFields(false);state.index=(state.index+delta+state.items.length)%state.items.length;render()}
function saveFields(showToast){if(!state.loaded||!state.items.length)return;const item=current();const n=$('nameField').value,d=$('descField').value;let raw=replaceProperty(item.raw,'name',n);raw=replaceProperty(raw,'desc',d);item.raw=raw;item.parsed=parseObject(raw);state.dirty=true;if(showToast){render();toast('Изменения применены к текущему объекту.')}}
function deleteCurrent(){if(!state.loaded||!state.items.length)return;const oldName=getItemVal(current().parsed,'name')||'(без имени)';state.items.splice(state.index,1);if(state.index>=state.items.length)state.index=0;state.dirty=true;render();toast('Удалён объект: '+oldName)}
function output(){if(!state.loaded){toast('Сначала загрузи исходный файл.');return}saveFields(false);const body=state.items.map(x=>x.raw).join(',\n        ');const result=state.prefix+(state.items.length?'\n        '+body+'\n    ':'')+state.suffix;const ta=document.createElement('textarea');ta.value=result;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();if(ok){state.dirty=false;updateStatus();toast('Готовый файл скопирован в буфер обмена.')}else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(result).then(()=>{state.dirty=false;updateStatus();toast('Готовый файл скопирован в буфер обмена.')}).catch(()=>showCopyFallback(result))}else showCopyFallback(result)}
function showCopyFallback(text){const w=window.open('','_blank');if(w){w.document.write('<!doctype html><meta charset="utf-8"><title>Скопируй результат</title><p>Автоматическое копирование не сработало. Выдели текст и скопируй его вручную:</p><textarea style="width:98%;height:85vh;background:#111;color:#eee"></textarea>');w.document.querySelector('textarea').value=text;w.document.querySelector('textarea').select()}else toast('Браузер запретил копирование. Разреши буфер обмена или открой страницу через localhost.')}
$('load').addEventListener('click',loadSource);$('prev').addEventListener('click',()=>move(-1));$('prevBottom').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('nextBottom').addEventListener('click',()=>move(1));$('delete').addEventListener('click',deleteCurrent);$('edit').addEventListener('click',()=>saveFields(true));$('copyResult').addEventListener('click',output);
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||document.activeElement.isContentEditable;if(e.key==='ArrowLeft'&&!typing){e.preventDefault();move(-1)}else if(e.key==='ArrowRight'&&!typing){e.preventDefault();move(1)}else if(e.key==='Delete'&&!typing){e.preventDefault();deleteCurrent()}});
})();
</script>
</body>
</html>
